version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cineva_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cineva_admin
      POSTGRES_PASSWORD: cineva_secure_password_2026
      POSTGRES_DB: cineva_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cineva_admin -d cineva_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cineva_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
