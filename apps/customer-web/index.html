<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CINEVA — Premium 3D Cinema Experience</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('cineva-theme') || 'dark';
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(saved === 'light' ? 'light' : 'dark');
        } catch (e) {}
      })();
    </script>
    <!-- Google Fonts: Inter (Design System Font) & Fallbacks -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
  </head>
  <body class="bg-cv-bg text-cv-primary font-sans antialiased selection:bg-cv-accent selection:text-white min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
